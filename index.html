
<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <!-- SEO Meta Tags -->

    <meta name="keywords" content="AI, Daadir, Aqli, Somali AI, Intelligence, Reasoning, Vision, UNISO, Somalia Software Engineer">
    <meta name="author" content="Daadir">

    <!-- Social Media Sharing -->
    <meta property="og:title" content="DAADIR.AI | The Future of Somali Intelligence">
    <meta property="og:description" content="Experience advanced neural reasoning and vision in a beautiful, private interface. Built by Daadir.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://daadir.is-a.dev">
    <meta property="og:image" content="https://daadir.42web.io/og-image.png">

    <!-- Mobile App Settings -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">

    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Plus Jakarta Sans', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
          },
        },
      }
    </script>
    <style>
      body {
        margin: 0;
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
        transition: background-color 0.3s ease;
      }

      input::-webkit-outer-spin-button,
      input::-webkit-inner-spin-button {
        -webkit-appearance: none !important;
        margin: 0 !important;
      }
      
      textarea {
        resize: none !important;
      }

      .custom-scrollbar::-webkit-scrollbar {
        width: 4px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #88888822;
        border-radius: 10px;
      }
      
      #root {
        height: 100vh;
        display: flex;
      }

      .initial-loader {
        position: fixed;
        inset: 0;
        background: #000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
      }

      @keyframes pulse-custom {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(0.95); }
      }
      .animate-loader {
        animation: pulse-custom 2s infinite ease-in-out;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "@google/genai": "https://esm.sh/@google/genai@^1.38.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "bcryptjs": "https://esm.sh/bcryptjs@^3.0.3"
  }
}
</script>
</head>
  <body class="bg-white dark:bg-black text-zinc-900 dark:text-zinc-100 transition-colors">
    <div id="root">
      <div class="initial-loader">
        <div class="animate-loader" style="width: 80px; height: 80px;">
           <svg viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M120 60 L 120 340 L 200 340 C 300 340, 360 280, 360 200 C 360 120, 300 60, 200 60 L 120 60 Z" fill="#fff" />
            <path d="M165 105 L 165 295 L 190 295 C 260 295, 300 250, 300 200 C 300 150, 260 105, 190 105 L 165 105 Z" fill="#000" />
            <rect x="120" y="195" width="45" height="10" fill="#000" />
          </svg>
        </div>
        <div style="margin-top: 32px; font-weight: 800; font-size: 14px; letter-spacing: 0.8em; color: #fff; text-indent: 0.8em;">DAADIR</div>
      </div>
    </div>
    <script type="module" src="/index.tsx"></script>
    <script>
      window.addEventListener('load', () => {
        setTimeout(() => {
          const loader = document.querySelector('.initial-loader');
          if (loader) {
            loader.style.opacity = '0';
            loader.style.transition = 'opacity 0.6s ease';
            setTimeout(() => loader.style.display = 'none', 600);
          }
        }, 1200);
      });
    </script>
  </body>
</html>

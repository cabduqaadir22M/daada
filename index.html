
<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>DAADIR.AI | Smart Assistant</title>
    
    <meta name="description" content="DAADIR.AI - A smarter way to work.">
    <meta name="author" content="Daadir">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">

    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Plus Jakarta Sans', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
          },
        },
      }
    </script>
    <style>
      body {
        margin: 0;
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
        background-color: #000;
        height: 100dvh;
      }

      * {
        scrollbar-width: none !important;
        -ms-overflow-style: none !important;
        border-color: transparent !important;
      }
      
      *::-webkit-scrollbar {
        display: none !important;
      }

      #root {
        height: 100dvh;
        display: flex;
      }

      .initial-loader {
        position: fixed;
        inset: 0;
        background: #000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
      }

      @keyframes pulse-ring {
        0% { transform: scale(0.8); opacity: 0; }
        50% { opacity: 0.1; }
        100% { transform: scale(1.5); opacity: 0; }
      }
      .loader-ring {
        position: absolute;
        width: 150px;
        height: 150px;
        border: 2px solid #fff;
        border-radius: 50%;
        animation: pulse-ring 2s infinite ease-out;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.38.0",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2",
    "bcryptjs": "https://esm.sh/bcryptjs@^3.0.3"
  }
}
</script>
</head>
  <body class="bg-white dark:bg-black text-zinc-900 dark:text-zinc-100 transition-colors">
    <div id="root">
      <div class="initial-loader">
        <div class="loader-ring"></div>
        <div style="width: 80px; height: 80px; position: relative; z-index: 10;">
           <svg viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M120 60 L 120 340 L 200 340 C 300 340, 360 280, 360 200 C 360 120, 300 60, 200 60 L 120 60 Z" fill="#fff" />
          </svg>
        </div>
        <div style="margin-top: 30px; font-weight: 700; font-size: 10px; letter-spacing: 0.5em; color: #fff; opacity: 0.5; text-transform: uppercase;">Loading Aqli...</div>
      </div>
    </div>
    <script type="module" src="/index.tsx"></script>
    <script>
      window.addEventListener('load', () => {
        setTimeout(() => {
          const loader = document.querySelector('.initial-loader');
          if (loader) {
            loader.style.opacity = '0';
            loader.style.transition = 'opacity 0.8s ease-out';
            setTimeout(() => loader.style.display = 'none', 800);
          }
        }, 1200);
      });
    </script>
  </body>
</html>
